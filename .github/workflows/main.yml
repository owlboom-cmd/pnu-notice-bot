
name: Notice Bot

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

# GitHub 저장소에 공지 기록을 저장하기 위한 권한
permissions:
  contents: write

# 중복 실행 방지
concurrency:
  group: notice-bot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # 무한 실행 방지
    timeout-minutes: 10

    steps:
      # 1. 저장소 코드 가져오기
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Python 설치
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 패키지 설치
      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 공지사항 확인 및 텔레그램 전송
      - name: 공지사항 확인
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      # 5. 공지 기록 GitHub에 저장
      - name: 공지 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add notice_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update notice history"

            git pull --rebase origin "${GITHUB_REF_NAME}"

            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "저장할 새로운 공지 기록이 없습니다."
          fi

      # 6. 프로그램 오류 발생 시 텔레그램 알림
      - name: 오류 알림
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ 부산대학교 Notice Bot 오류 발생! GitHub Actions 실행 로그를 확인해주세요."
          fi
